<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📋 작업 보드 | BOARD-TITLE</title>
<!--
  board — 행(앱/리포/타입) × 열(시간) 격자에 카드를 놓는 프로젝트 진행판 + 같은 페이지의 런북 탭.
  데이터는 전부 아티팩트 db(meta/board · meta/sync · cards/<id> · meta/runbook · runbook/<절id>)에 있고 이 파일은 프로젝트마다 그대로 게시한다.
  스키마·쓰기 주체 규칙은 skills/board/schema.md. ORDER/STAGES 블록은 scripts/lib 복제본이다(테스트가 동일성 검사).
  `?demo`로 열면 내장 샘플로 렌더한다(로컬 검증용).
-->
<style>
  :root {
    --paper: #ffffff; --raise: #f5f7fa;
    --ink: #131b26; --muted: #4d596a; --faint: #788594;
    --rule: #d5dbe4; --rule-firm: #b9c2cf;
    --signal: #21489f; --signal-soft: #e4ebf9;
    --good: #256549; --good-soft: #dcece4;
    --warn: #8d5510; --warn-soft: #f4e8d6;
    --bad: #9c352f; --bad-soft: #f6e3e1; --block: #6b4fbb;
    --teal: #0f6b6b; --teal-soft: #d9eeee; --plum: #5d3f9e; --plum-soft: #e9e2f5; --rose: #8f3564; --rose-soft: #f4e1ea;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Pretendard", system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --rowhead: 176px; --colmin: 236px; --colfold: 44px; --barh: 44px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0f141b; --raise: #171f29;
      --ink: #dee5ed; --muted: #9aa6b5; --faint: #6f7c8c;
      --rule: #263140; --rule-firm: #38455a;
      --signal: #86a8f2; --signal-soft: #17233a;
      --good: #63b591; --good-soft: #13241d;
      --warn: #cfa057; --warn-soft: #271f13;
      --bad: #d98a83; --bad-soft: #2b1715; --block: #b1a0ee;
      --teal: #6fc2c2; --teal-soft: #112626; --plum: #b39be6; --plum-soft: #1f1830; --rose: #e08fb6; --rose-soft: #2c1622;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0f141b; --raise: #171f29;
    --ink: #dee5ed; --muted: #9aa6b5; --faint: #6f7c8c;
    --rule: #263140; --rule-firm: #38455a;
    --signal: #86a8f2; --signal-soft: #17233a;
    --good: #63b591; --good-soft: #13241d;
    --warn: #cfa057; --warn-soft: #271f13;
    --bad: #d98a83; --bad-soft: #2b1715;
    --teal: #6fc2c2; --teal-soft: #112626; --plum: #b39be6; --plum-soft: #1f1830; --rose: #e08fb6; --rose-soft: #2c1622;
    color-scheme: dark;
  }
  /* 타입 색 — pr·doc·qa·ask·infra·decision */
  :root { --c-pr: var(--signal); --cs-pr: var(--signal-soft); --c-doc: var(--teal); --cs-doc: var(--teal-soft);
    --c-qa: var(--good); --cs-qa: var(--good-soft); --c-ask: var(--warn); --cs-ask: var(--warn-soft);
    --c-infra: var(--plum); --cs-infra: var(--plum-soft); --c-decision: var(--rose); --cs-decision: var(--rose-soft); }

  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--rule-firm) transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 13.5px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overflow: hidden; display: grid; grid-template-rows: var(--barh) 1fr; }
  a { color: var(--signal); text-decoration: none; border-bottom: 1px solid var(--rule-firm); }
  a:hover { border-bottom-color: var(--signal); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
  .mono { font-family: var(--mono); }
  .lab { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; }

  /* ── 상단 바 ── */
  .bar { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--rule); background: var(--paper); min-width: 0; }
  .bar h1 { font-size: 16px; font-weight: 700; margin: 0 6px 0 0; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .bar .sp { flex: 1; }
  .bar .sync { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; margin-right: 6px; }
  .bar .sync b { color: var(--muted); font-weight: 600; }
  .bar .grp { display: flex; align-items: center; gap: 4px; padding-left: 10px; border-left: 1px solid var(--rule); }
  .bar .gl { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: inline-flex; align-items: center; gap: 4px; margin-right: 2px; white-space: nowrap; }
  .bar .gl .ic { width: 12px; height: 12px; opacity: .7; }
  .bar .ib { display: inline-flex; align-items: center; gap: 5px; background: transparent; }
  .bar .ib .ic { width: 14px; height: 14px; opacity: .9; }
  .bar .ib.icon-only { padding: 5px 7px; }
  .bar .seg { display: inline-flex; border: 1px solid var(--rule-firm); border-radius: 999px; padding: 2px; margin-left: 10px; background: var(--raise); }
  .bar .seg button { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 11px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); white-space: nowrap; }
  .bar .seg button .ic { width: 13px; height: 13px; }
  .bar .seg button.on { background: var(--signal); color: var(--paper); }
  .bar .seg button:not(.on):hover { color: var(--ink); }
  @media (max-width: 1180px) { .bar .gl { display: none; } .bar .grp { padding-left: 6px; } }
  .tog { font-family: var(--sans); font-size: 12px; font-weight: 600; padding: 5px 12px; border: 1px solid transparent; border-radius: 999px; background: var(--raise); color: var(--muted); white-space: nowrap; transition: background .12s, color .12s; }
  .tog:hover { background: var(--rule); color: var(--ink); }
  .tog.on { color: var(--signal); background: var(--signal-soft); }
  .tog .n { display: inline-block; min-width: 16px; text-align: center; font-family: var(--mono); font-size: 10px; color: var(--paper); background: var(--muted); border-radius: 999px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }
  .tog .n:empty { display: none; }
  .tog.on .n { background: var(--signal); }
  .badge { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.warn { color: var(--warn); background: var(--warn-soft); } .badge.bad { color: var(--bad); background: var(--bad-soft); }
  .badge.dim { color: var(--faint); background: var(--raise); } .badge.info { color: var(--signal); background: var(--signal-soft); }

  /* ── 격자 ── */
  .wrap { position: relative; min-height: 0; display: grid; grid-template-columns: 1fr 0; transition: grid-template-columns .12s; }
  .wrap.panel-open { grid-template-columns: 1fr 380px; }
  .grid { overflow: auto; height: 100%; display: grid; grid-auto-rows: max-content; align-content: start;
    background: var(--paper); touch-action: pan-x pan-y; }
  .hcorner, .hcol, .hrow, .cell { background: var(--paper); min-width: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .hcorner, .hcol { background: color-mix(in srgb, var(--raise) 70%, var(--paper)); }
  .hcorner { position: sticky; top: 0; left: 0; z-index: 4; padding: 10px 14px; display: flex; align-items: center; }
  .hcorner .lab { background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 9px; }
  .hcol { position: sticky; top: 0; z-index: 3; display: flex; align-items: stretch; }
  .hcol .hbtn { flex: 1; min-width: 0; padding: 9px 4px 8px 14px; text-align: left; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: transparent; border: 0; color: inherit; }
  .hcol .fb { flex: none; width: 24px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--faint); opacity: 0; }
  .hcol:hover .fb, .hcol.fold .fb { opacity: 1; } .hcol .fb:hover { color: var(--signal); }
  .hcol .fb .ic { width: 14px; height: 14px; opacity: 1; }
  .hcol.fold { flex-direction: column; align-items: center; }
  .hcol.fold .fb { width: 100%; height: 26px; }
  .hcol.fold .hbtn { writing-mode: vertical-rl; padding: 4px 0 12px; justify-content: flex-start; flex-wrap: nowrap; gap: 6px; }
  .hcol.fold .hbtn .t { font-size: 12px; white-space: nowrap; }
  .hcol.fold .hbtn .r, .hcol.fold .hbtn .nt { display: none; }
  .hcol.fold .hbtn .np { writing-mode: horizontal-tb; transform: rotate(90deg); }
  .cell.fold { padding: 8px 0; text-align: center; }
  .cell.fold .cnt { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--raise); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 5px; }
  .cell.fold .cnt.ok { color: var(--good); border-color: var(--good); }
  .cell.fold .add { display: none; }
  .hcol .t { font-weight: 700; font-size: 13px; }
  .hcol .r { font-family: var(--mono); font-size: 10.5px; color: var(--muted); background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
  .hcol .nt { font-family: var(--mono); font-size: 10.5px; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 1px 8px; }
  .hcol .np { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--paper); background: var(--signal); border-radius: 999px; padding: 2px 7px; }
  .hcol.now { background: color-mix(in srgb, var(--signal-soft) 60%, var(--paper)); } .hcol.now .t { color: var(--signal); }
  .hrow { position: sticky; left: 0; z-index: 2; display: flex; align-items: stretch; background: color-mix(in srgb, var(--raise) 50%, var(--paper)); }
  .hrow .hbtn { flex: 1; min-width: 0; width: 100%; padding: 12px 14px; text-align: left; display: block; background: transparent; border: 0; color: inherit; }
  .hrow .fb { position: absolute; right: 4px; top: 6px; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: var(--faint); opacity: 0; border-radius: 5px; }
  .hrow:hover .fb, .hrow.fold .fb { opacity: 1; } .hrow .fb:hover { color: var(--signal); }
  .hrow .fb .ic { width: 14px; height: 14px; opacity: 1; }
  .hrow.fold .hbtn { padding: 6px 28px 6px 14px; display: flex; align-items: center; gap: 8px; }
  .hrow.fold .hbtn .kind { margin-bottom: 0; flex: none; }
  .hrow.fold .hbtn .t { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hrow.fold .hbtn .s { display: none; }
  .hrow.fold .fb { top: 50%; transform: translateY(-50%); }
  .cell.rfold { min-height: 0; padding: 6px 8px; }
  .cell.rfold.fold { padding: 6px 2px; text-align: center; }
  .cell.rfold.fold .cnt { padding: 1px 4px; }
  .cell.rfold .cnt { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--muted); background: var(--raise); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 7px; }
  .cell.rfold .cnt.ok { color: var(--good); border-color: var(--good); }
  .cell.rfold .add { display: none; }
  .hrow .t { font-weight: 700; font-size: 13.5px; display: flex; align-items: center; gap: 6px; letter-spacing: -.01em; }
  .hrow .s { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-top: 3px; line-height: 1.35; }
  /* 행 종류 — 아이콘 없이 글자만, 알약 */
  .hrow .kind { display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
    color: var(--paper); background: var(--c); padding: 2px 9px 1px; margin-bottom: 7px; line-height: 1.3; border-radius: 999px; }
  .hcol:hover, .hrow:hover { background: var(--raise); }
  .cell { padding: 8px 8px 6px; min-height: 64px; position: relative; }
  .cell.now { background: color-mix(in srgb, var(--signal-soft) 40%, var(--paper)); }
  .cell.over { box-shadow: inset 0 0 0 2px var(--signal); border-radius: 0; }
  .cell .add { display: block; width: 100%; text-align: center; font-size: 12px; color: transparent; padding: 5px 8px; margin-top: 2px; border-radius: 8px; border: 1px dashed transparent; transition: color .12s, border-color .12s; }
  .cell:hover .add { color: var(--faint); border-color: var(--rule); } .cell .add:hover { color: var(--signal); border-color: var(--signal); background: var(--signal-soft); }
  .ro .cell .add { display: none; } .ro .hdr-edit { pointer-events: none; }

  /* ── 카드 ── */
  /* 카드 — 사용자 요청(2026-09-19)으로 이 페이지만 라운드·그림자를 쓴다. 타입 색 띠는 ::before(라운드 안쪽) */
  .card { position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px 9px; margin-bottom: 6px;
    box-shadow: 0 1px 2px rgba(15, 20, 27, .05); cursor: grab; user-select: none; -webkit-user-select: none; transition: box-shadow .12s, border-color .12s, transform .12s; }
  .card:last-of-type { margin-bottom: 2px; }
  .card:hover { border-color: var(--rule-firm); box-shadow: 0 6px 16px rgba(15, 20, 27, .10); transform: translateY(-1px); }
  .card.sel { border-color: var(--signal); box-shadow: 0 0 0 2px var(--signal-soft), 0 6px 16px rgba(15, 20, 27, .10); }
  .card.t-pr { --c: var(--c-pr); --cs: var(--cs-pr); } .card.t-doc { --c: var(--c-doc); --cs: var(--cs-doc); } .card.t-qa { --c: var(--c-qa); --cs: var(--cs-qa); }
  .card.t-ask { --c: var(--c-ask); --cs: var(--cs-ask); } .card.t-infra { --c: var(--c-infra); --cs: var(--cs-infra); } .card.t-decision { --c: var(--c-decision); --cs: var(--cs-decision); }
  .card.done { opacity: .45; } .card.done:hover { opacity: .8; }
  /* PR ready(4단계 리뷰부터) — draft를 벗어나 사람 리뷰만 남은 카드. 배경·배지로 draft 이하와 갈린다 */
  .card.ready { background: color-mix(in srgb, var(--cs) 60%, var(--paper)); border-color: color-mix(in srgb, var(--c) 45%, var(--rule)); }
  .card.ready:hover { border-color: var(--c); }
  .card.ready.sel { border-color: var(--signal); }
  .card .rdy { flex: none; font-family: var(--mono); font-size: 9px; letter-spacing: .1em; font-weight: 700; color: var(--paper); background: var(--c); border-radius: 4px; padding: 1px 5px; line-height: 13px; }
  .card.delayed, .card.ready.delayed { border-color: color-mix(in srgb, var(--bad) 45%, var(--rule)); }
  .card.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--bad); } 100% { box-shadow: none; } }
  .card.ghost { opacity: .35; border-style: dashed; box-shadow: none; transform: none; }
  .card.pending::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .card.pending { border-style: dotted; }
  .card .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .card .tt { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--c); background: var(--cs); padding: 1px 6px; border-radius: 4px; flex: 0 0 auto; }
  .card .hd .act { position: absolute; right: 6px; top: 6px; display: flex; gap: 2px; opacity: 0; transition: opacity .12s; background: var(--paper); padding-left: 6px; border-radius: 6px; }
  .card.done .hd .act { background: transparent; }
  .card:hover .act, .card:focus-within .act, .card.sel .act { opacity: 1; }
  .card .ab { width: 22px; height: 20px; padding: 0; border: 0; background: transparent; color: var(--faint); border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .card .ab .ic { width: 13px; height: 13px; opacity: 1; }
  .card .ab:hover { color: var(--signal); background: var(--raise); }
  @media (pointer: coarse) { .card .hd .act { opacity: 1; right: 20px; } }
  .card .hd .num { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); border: 0; }
  .card .hd .num:hover { color: var(--signal); }
  .card .ttl { display: flex; align-items: flex-start; gap: 6px; font-weight: 640; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
  .card .ttl > span { min-width: 0; }
  .card .env { flex: none; font-family: var(--mono); font-size: 9px; letter-spacing: .1em; font-weight: 700; color: var(--muted); border: 1px solid var(--rule-firm); border-radius: 4px; padding: 1px 5px; line-height: 13px; }
  .card .env.prod { color: var(--bad); border-color: var(--bad); }
  .card .hd .st2 { flex: 1 1 auto; min-width: 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: .02em; color: var(--c); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .hd .st2.unk { color: var(--bad); background: var(--bad-soft); padding: 0 5px; border-radius: 4px; }
  .card .sub { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .note { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .delay { display: flex; align-items: center; gap: 6px; margin: 8px -10px -9px; padding: 6px 10px; background: var(--bad-soft); color: var(--bad); font-size: 11.5px; font-weight: 600; line-height: 1.4; border-top: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); border-radius: 0 0 9px 9px; }
  .card .delay .k { flex: none; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .card .delay span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .blk { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; margin-top: 4px; font-size: 11.5px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .card .blk .to { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .card .blk .ic { width: 12px; height: 12px; opacity: 1; flex: none; color: var(--block); display: block; }
  .card .blk .k { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--block); flex: none; line-height: 16px; }
  .card .blk .to { border: 0; background: transparent; color: var(--ink); font: inherit; line-height: 16px; padding: 0; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; text-align: left; }
  .card .blk .to:hover { color: var(--signal); text-decoration-style: solid; }
  .card .blk .sep { opacity: .5; }
  .card .grip { position: absolute; right: 4px; top: 4px; width: 14px; height: 18px; font-family: var(--mono); font-size: 11px; color: var(--rule-firm); text-align: center; line-height: 18px; touch-action: none; cursor: grab; display: none; }
  @media (pointer: coarse) { .card .grip { display: block; } }
  .card .steps { display: flex; gap: 3px; margin-top: 7px; align-items: center; }
  .card .steps .off { flex: none; font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--bad); border: 1px solid var(--bad); border-radius: 4px; padding: 0 4px; line-height: 12px; margin-left: 3px; }
  .tip { position: fixed; z-index: 70; max-width: 240px; background: var(--ink); color: var(--paper); font-size: 11.5px; line-height: 1.4; padding: 6px 9px; border-radius: 6px; box-shadow: 0 8px 24px rgba(15,20,27,.2); pointer-events: none; opacity: 0; transition: opacity .08s; transform: translate(-50%, calc(-100% - 8px)); }
  .tip.show { opacity: 1; }
  .tip .h { display: block; font-weight: 700; font-size: 11px; }
  .tip .h .mono { font-family: var(--mono); opacity: .7; margin-right: 6px; }
  .tip .d { display: block; }
  .tip .k { display: block; opacity: .6; margin-top: 3px; font-size: 10.5px; }
  .card .steps button { flex: 1; height: 5px; border-radius: 3px; background: var(--rule); padding: 0; min-width: 0; transition: background .12s; }
  .card .steps button:not(:disabled):hover { background: var(--rule-firm); }
  .card .steps button.on { background: var(--c); opacity: .45; }

(() => {
"use strict";
/*ORDER-BEGIN*/
const ORD_DIGITS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const ORD_BASE = ORD_DIGITS.length;
function ordVal(ch) { const v = ORD_DIGITS.indexOf(ch); if (v < 0) throw new Error("order: bad digit " + ch); return v; }
// a < b 인 두 키 사이의 키. a=null 은 -∞, b=null 은 +∞. 결과는 '0'으로 끝나지 않는다(그래야 그 앞에 또 넣을 수 있다).
function between(a, b) {
  a = a || "";
  if (b != null && a !== "" && !(a < b)) throw new Error("order: a must be < b (" + a + " >= " + b + ")");
  if (b === "") throw new Error("order: b must not be empty");
  let out = "", i = 0, hi = b;
  for (;;) {
    const da = i < a.length ? ordVal(a[i]) : 0;
    const db = hi == null ? ORD_BASE : (i < hi.length ? ordVal(hi[i]) : ORD_BASE);
    if (hi != null && i >= hi.length) throw new Error("order: b is a prefix of a");
    if (db - da > 1) return out + ORD_DIGITS[Math.floor((da + db) / 2)];
    out += ORD_DIGITS[da];
    if (db - da === 1) hi = null;
    i++;
  }
}
function ordFirst() { return between(null, null); }
function ordCompare(x, y) { return x < y ? -1 : x > y ? 1 : 0; }
/*ORDER-END*/
/*STAGES-BEGIN*/
const STAGES = {
  pr:       ["todo", "wip", "draft", "review", "approved", "merged", "closed"],
  doc:      ["todo", "draft", "review", "published"],
  qa:       ["todo", "in_progress", "pass", "fail", "blocked"],
  ask:      ["todo", "requested", "waiting", "done"],
  infra:    ["planned", "requested", "in_progress", "done"],
  decision: ["pending", "decided"],
};
const DONE = { pr: ["merged", "closed"], doc: ["published"], qa: ["pass"], ask: ["done"], infra: ["done"], decision: ["decided"] };
const STAGE_LABEL = {
  todo: "착수 전", wip: "작업 중", draft: "draft", approved: "승인", merged: "머지", closed: "닫힘",
  review: "리뷰", published: "게시", in_progress: "진행", pass: "pass", fail: "fail", blocked: "blocked",
  requested: "요청함", waiting: "회신 대기", done: "완료", planned: "예정", pending: "대기", decided: "결정됨",
};
const TYPE_LABEL = { pr: "PR", doc: "문서", qa: "QA", ask: "요청", infra: "인프라", decision: "결정" };
const TYPE_ICON = { pr: "⟨/⟩", doc: "¶", qa: "✓", ask: "✉", infra: "⇪", decision: "◆" };
function isDone(type, stage) { return (DONE[type] || []).includes(stage); }
// 라벨은 타입의 어휘 안에서만 찾는다(복사 텍스트용 — 카드 첫 줄은 cardHTML의 unk 분기가 같은 일을 한다). qa 카드의 "done"을 ask의 "완료"로 읽어 주면 흐림 없이 글자만 "완료"인 모호한 카드가 된다.
function stageLabel(type, stage) { if (!stage) return "—"; return (STAGES[type] || []).includes(stage) ? (STAGE_LABEL[stage] || stage) : `단계 오류 · ${stage}`; }
function stageIndex(type, stage) { return (STAGES[type] || []).indexOf(stage); }
/*STAGES-END*/
// 스텝 바는 "순서대로 지나가는 경로"만 그린다. 닫힘·fail·blocked는 경로의 다음 칸이 아니라 갈림길이라 바 옆 태그로 뺀다(패널에서는 선택 가능).
const OFFPATH = { pr: ["closed"], qa: ["fail", "blocked"] };
const pathOf = (t) => (STAGES[t] || []).filter((s) => !(OFFPATH[t] || []).includes(s));

const STAGE_DESC = {
  pr: { todo: "원격 브랜치도 PR도 없음", wip: "원격 브랜치는 있고 PR은 아직 없음", draft: "PR이 draft", review: "PR ready · 리뷰 진행 (타인 리뷰·코멘트 수는 첫 줄에)", approved: "리뷰 승인(APPROVED)", merged: "머지됨", closed: "머지 없이 닫힘" },

const Theme = (() => {
